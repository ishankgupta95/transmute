<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#56b8e6" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#56b8e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#56b8e6" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#56b8e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#56b8e6"/>
      <stop offset="100%" stop-color="#3fa8db"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#08080a"/>

  <!-- Subtle grid -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Gradient orbs -->
  <circle cx="280" cy="180" r="320" fill="url(#orb1)"/>
  <circle cx="980" cy="520" r="260" fill="url(#orb2)"/>

  <!-- Accent bar -->
  <rect x="100" y="295" width="60" height="3" fill="url(#accent)"/>

  <!-- Pill / status badge -->
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="320" height="40" rx="20" fill="#111114" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="22" cy="20" r="4" fill="#56b8e6"/>
    <text x="38" y="26" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="14" font-weight="500" fill="#8a8880">100% browser-based · No uploads</text>
  </g>

  <!-- Headline -->
  <text x="100" y="350" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="#e8e5e0">Transmute</text>

  <!-- Sub-headline -->
  <text x="100" y="430" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="36" font-weight="500" fill="#56b8e6">Free file conversion tools.</text>
  <text x="100" y="478" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="36" font-weight="500" fill="#8a8880">Right in your browser.</text>

  <!-- Footer row -->
  <g transform="translate(100, 555)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="20" font-weight="600" fill="#7a7870">transmute.tools</text>
    <text x="200" y="0" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="20" font-weight="400" fill="#7a7870">·  Image · PDF · Audio · Video · Developer</text>
  </g>
</svg>
