name: CI
on:
  push:
    branches: [master, main]

# Lint, type check and unit tests run in the husky pre-commit hook
# (.husky/pre-commit), so they are not repeated here. This workflow only
# builds and deploys. `next build` still type-checks, so a type error that
# slipped past the hook (e.g. `git commit --no-verify`) still blocks a deploy.
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
